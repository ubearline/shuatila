name: Build & Publish Docker Image

# 说明：
# - 推 tag（如 v1.0.0）→ 构建多架构镜像并推送 GHCR
# - 推 main → 构建并推送 latest
# 仅使用 GitHub Container Registry（ghcr.io），无需 Docker Hub。
# GHCR 使用内置 GITHUB_TOKEN，无需额外配置密钥。

on:
  push:
    tags: ["v*"]
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: meta
        run: |
          repo_lower=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "image=${REGISTRY}/${repo_lower}" >> $GITHUB_OUTPUT
          ref="${{ github.ref_type }}"
          if [ "$ref" = "tag" ]; then
            echo "tags=${GITHUB_REF_NAME},latest" >> $GITHUB_OUTPUT
          else
            echo "tags=latest" >> $GITHUB_OUTPUT
          fi

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
