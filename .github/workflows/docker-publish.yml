name: Build & Publish Docker Image

# 说明：
# - 推 tag（如 v1.0.0）→ 构建多架构镜像并推送 GHCR（镜像名 + latest）
# - 推 main → 构建并推送 latest
# 仅使用 GitHub Container Registry（ghcr.io），无需 Docker Hub。
# GHCR 使用内置 GITHUB_TOKEN，无需额外配置密钥。

on:
  push:
    tags: ["v*"]
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 统一用 metadata-action 生成 tag，避免手拼字符串出错：
      # - tag 推送（v1.2.3）→ ghcr.io/<repo>:1.2.3 和 :latest
      # - main 推送 → ghcr.io/<repo>:latest
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
