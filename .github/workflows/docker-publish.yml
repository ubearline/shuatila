name: Build & Publish Docker Image

# 发版策略：
# - 推 tag（如 v1.0.0）→ 构建多架构镜像并推送 GHCR（版本号 + latest）
# - 仅推 main（无新 tag）→ 跳过 build/push，只有 tag 发版才出镜像
# - workflow_dispatch 手动触发时，若有 tag ref 则按 tag 发版，否则跳过
# 仅使用 GitHub Container Registry（ghcr.io），GHCR 用内置 GITHUB_TOKEN，无需额外密钥。

on:
  push:
    tags: ["v*"]
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # 预检：本次触发是否为 tag 发版
  check:
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.judge.outputs.release }}
    steps:
      - name: 判定是否 tag 发版
        id: judge
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "tag 发版: $GITHUB_REF"
          else
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "非 tag 推送（$GITHUB_REF），跳过 build/push"
          fi

  build:
    needs: check
    if: needs.check.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # tag 推送（v1.2.3）→ ghcr.io/<repo>:1.2.3 和 :latest
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # 仅 amd64：arm64 在 x86 runner 上走 QEMU 模拟，构建耗时 3-5 倍（next build 4min+），
          # 得不偿失；如需 arm64 再启用 native arm runner 或 buildx 多平台。
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
