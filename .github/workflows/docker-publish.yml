name: Build & Publish Docker Image

# 说明：
# - 推 tag（如 v1.0.0）→ 构建多架构镜像并推送 GHCR + Docker Hub
# - 推 main → 构建并推送 latest（可选）
# 首次使用需在仓库 Settings → Secrets 配置：
#   GHCR 用内置 GITHUB_TOKEN 即可；Docker Hub 需配置 DOCKERHUB_USERNAME / DOCKERHUB_TOKEN

on:
  push:
    tags: ["v*"]
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY_GHCR: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: env.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Compute image tags
        id: meta
        run: |
          repo_lower=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "ghcr=ghcr.io/${repo_lower}" >> $GITHUB_OUTPUT
          echo "hub=${repo_lower}" >> $GITHUB_OUTPUT
          ref="${{ github.ref_type }}"
          if [ "$ref" = "tag" ]; then
            echo "tags=${GITHUB_REF_NAME},latest" >> $GITHUB_OUTPUT
          else
            echo "tags=latest" >> $GITHUB_OUTPUT
          fi

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ steps.meta.outputs.ghcr }}:${{ steps.meta.outputs.tags }}
            ${{ steps.meta.outputs.hub }}:${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
