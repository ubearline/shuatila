name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.16.1

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Assemble question bank (from committed parts)
        run: pnpm run db:assemble

      - name: Type check
        run: pnpm run typecheck

      - name: Lint
        run: pnpm run lint || true

      - name: Unit tests (SM-2)
        run: pnpm test

      - name: Production build
        run: pnpm run build
